# Project Nur starter config
#
# This file is a readable reference copy of the local runtime settings.
# The real app reads and writes runtime_config.yaml.

data_dir: data
max_queue_per_user: 3
max_active_sessions: 10
session_timeout_seconds: 1800.0
console_enabled: true

# Telegram is off until you paste a bot token here.
telegram_token: ''
telegram_allowlist: []
telegram_poll_timeout: 30
dedupe_ttl: 60.0

# Fastest local start: leave this on "mock".
# Hosted provider / gateway: set llm_backend to "provider", then fill
# llm_base_url, llm_model, and llm_api_key.
# OpenAI-compatible endpoint: set llm_backend to "openai_compatible",
# then fill llm_base_url and llm_model. This works with Ollama's OpenAI
# API, vLLM, LM Studio, or a compatible hosted gateway.
llm_backend: mock
llm_base_url: ''
llm_model: ''
llm_api_key: ''

debug_host: 127.0.0.1
debug_port: 8077

proactive_enabled: false
proactive_idle_threshold: 300.0
proactive_density_reference: 3
proactive_recovery_seconds: 300.0
proactive_check_interval: 60.0

# Character independence sandbox controls.
character_independence: false
coherence_min_score: 0.6
coherence_max_regenerations: 2
pending_intake_ttl_turns: 3

# Leave api_key empty to keep the standalone web API open on localhost.
# When this is set, /chat, /config, /debug, /session/end, /rest, /ws, and
# every /v1/* endpoint except /v1/health and /v1/ready require
# `Authorization: Bearer <api_key>`.
api_key: ''
cors_origins: []

# Agentic tools. OFF by default: the chat layer can match user text to
# actions like fs.read_file / fs.delete_path / shell.run_command via regex,
# so exposing tools without auth and a sandbox is unsafe. When you turn
# tools on, filesystem operations are restricted to `tools_workspace`
# (defaults to `<data_dir>/workspace`). Shell execution requires the
# separate `shell_tool_enabled` flag.
tools_enabled: false
autonomy_level: assisted
tools_workspace: ''
shell_tool_enabled: false
