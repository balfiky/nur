# Project Nur starter config
#
# This file is a readable reference copy of the local runtime settings.
# The real app reads and writes runtime_config.yaml.

data_dir: data
max_queue_per_user: 3
max_active_sessions: 10
session_timeout_seconds: 1800.0
console_enabled: true

# Telegram is off until you paste a bot token here.
telegram_token: ''
telegram_allowlist: []
telegram_poll_timeout: 30
dedupe_ttl: 60.0

# Fastest local start: leave this on "mock".
# MiniMax: set llm_backend to "minimax" and provide a local key.
# Local model server: set llm_backend to "openai_compatible", then fill
# llm_base_url and llm_model.
llm_backend: mock
llm_base_url: ''
llm_model: ''
llm_api_key: ''
minimax_api_key: ''

debug_host: 127.0.0.1
debug_port: 8077

proactive_enabled: false
proactive_idle_threshold: 300.0
proactive_max_per_session: 3
proactive_cooldown: 300.0
proactive_check_interval: 60.0

# Leave api_key empty to keep the standalone web API open on localhost.
api_key: ''
cors_origins: []
