<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc"><title id="title">Component Claim Map</title><desc id="desc">Evidence status per architectural component under the current Phase 11 scenario suite. Zero-effect is not inertness — it is a bounded falsifiability claim about this suite.</desc><defs><marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L9,5 L1,9 Z" fill="#57606a"/></marker></defs><rect width="100%" height="100%" fill="#fafbfc"/><text x="48" y="52" text-anchor="start" font-family="'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="28" font-weight="800" fill="#1f2328">Component Claim Map</text><text x="48" y="78" text-anchor="start" font-family="'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="14" font-weight="400" fill="#57606a">Evidence status per architectural component under the current Phase 11 scenario suite. Zero-effect is not inertness — it is a bounded falsifiability claim about this suite.</text><rect x="60" y="140" width="460" height="250" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<text x="290.0" y="163" text-anchor="middle" font-family="'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2328">Relationship memory</text>
<rect x="80" y="200" width="260" height="30" rx="15.0" fill="#dafbe1" stroke="#2da44e" stroke-width="1.5"/>
<text x="210.0" y="219.0" text-anchor="middle" font-family="'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="12" font-weight="600" fill="#116329">LOAD-BEARING</text>
<text x="80" y="265" text-anchor="start" font-family="'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="13" font-weight="400" fill="#57606a">Disabling breaks exactly the two scenarios that depend on</text>
<text x="80" y="283" text-anchor="start" font-family="'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="13" font-weight="400" fill="#57606a">cross-turn open-loop state; zero unexpected failures.</text>
<rect x="550" y="140" width="460" height="250" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<text x="780.0" y="163" text-anchor="middle" font-family="'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2328">Semantic memory</text>
<rect x="570" y="200" width="260" height="30" rx="15.0" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
<text x="700.0" y="219.0" text-anchor="middle" font-family="'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="12" font-weight="600" fill="#1f2328">NEGATIVE CONTROL</text>
<text x="570" y="265" text-anchor="start" font-family="'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="13" font-weight="400" fill="#57606a">Phase 11 does not exercise semantic retrieval. Zero effect</text>
<text x="570" y="283" text-anchor="start" font-family="'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="13" font-weight="400" fill="#57606a">is the expected result and is the observed result.</text>
<rect x="1040" y="140" width="460" height="250" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<text x="1270.0" y="163" text-anchor="middle" font-family="'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2328">Inner dialogue</text>
<rect x="1060" y="200" width="260" height="30" rx="15.0" fill="#cffafe" stroke="#0891b2" stroke-width="1.5"/>
<text x="1190.0" y="219.0" text-anchor="middle" font-family="'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="12" font-weight="600" fill="#164e63">NOT FALSIFIABLE HERE</text>
<text x="1060" y="265" text-anchor="start" font-family="'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="13" font-weight="400" fill="#57606a">Deliberation rounds do not move the strategy selector. A</text>
