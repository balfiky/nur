<text x="80" y="555" text-anchor="start" font-family="'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="13" font-weight="400" fill="#57606a">Shapes generator output, which Phase 11 does not grade.</text>
