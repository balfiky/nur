<svg xmlns="http://www.w3.org/2000/svg" width="1650" height="1060" viewBox="0 0 1650 1060" role="img" aria-labelledby="title desc">
<title id="title">Evaluation and Ablation Harness</title>
<desc id="desc">Scenarios run against a real pipeline with explicit backend selection and provenance-stamped reports.</desc>
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
    <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
  </marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
    <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.16"/>
  </filter>
  <style>
    .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 30px; font-weight: 800; fill: #0f172a; }
    .subtitle { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; fill: #475569; }
    .group-title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 18px; font-weight: 800; fill: #0f172a; }
    .box-title { font-family: 'Segoe UI', Arial, sans-serif; font-weight: 800; fill: #0f172a; }
    .box-body { font-family: 'Segoe UI', Arial, sans-serif; fill: #334155; }
    .edge-label { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #334155; }
    .plain { font-family: 'Segoe UI', Arial, sans-serif; }
  </style>
</defs>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="40" y="50" class="title">Evaluation and Ablation Harness</text>
<text x="40" y="78" class="subtitle">Scenarios run against a real pipeline with explicit backend selection and provenance-stamped reports.</text>
<rect x="60" y="130" width="330" height="650" rx="24" fill="#eff6ff" stroke="#93c5fd" stroke-width="2" stroke-dasharray="8 8"/>
<text x="80" y="164" class="group-title">CLI input</text>
<rect x="460" y="130" width="430" height="650" rx="24" fill="#f0fdf4" stroke="#86efac" stroke-width="2" stroke-dasharray="8 8"/>
<text x="480" y="164" class="group-title">Per-scenario execution</text>
<rect x="970" y="130" width="260" height="650" rx="24" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2" stroke-dasharray="8 8"/>
<text x="990" y="164" class="group-title">Provenance</text>
<rect x="1320" y="130" width="270" height="650" rx="24" fill="#fff7ed" stroke="#fdba74" stroke-width="2" stroke-dasharray="8 8"/>
<text x="1340" y="164" class="group-title">Artifacts</text>
<rect x="460" y="820" width="1130" height="170" rx="24" fill="#fef3c7" stroke="#fbbf24" stroke-width="2" stroke-dasharray="8 8"/>
<text x="480" y="854" class="group-title">Ablation mode</text>
<path d="M355,253 L500,242" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="347.5" y="222.5" width="160" height="22" rx="8" fill="#f8fafc" opacity="0.92"/>
<text x="427.5" y="239.5" text-anchor="middle" class="edge-label">backend factory</text>
<path d="M355,395 L500,242" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="347.5" y="293.5" width="160" height="22" rx="8" fill="#f8fafc" opacity="0.92"/>
<text x="427.5" y="310.5" text-anchor="middle" class="edge-label">scenarios</text>
<path d="M625,279 L625,330" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/>
<path d="M625,404 L625,455" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/>
<path d="M625,529 L625,580" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/>
<path d="M750,617 L1360,260" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="975.0" y="413.5" width="160" height="22" rx="8" fill="#f8fafc" opacity="0.92"/>
<text x="1055.0" y="430.5" text-anchor="middle" class="edge-label">metrics</text>
<path d="M1100,310 L1360,260" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)" stroke-dasharray="7 6"/>
<rect x="1150.0" y="260.0" width="160" height="22" rx="8" fill="#f8fafc" opacity="0.92"/>
<text x="1230.0" y="277.0" text-anchor="middle" class="edge-label">stamp</text>
<path d="M1100,460 L1360,260" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)" stroke-dasharray="7 6"/>
<rect x="1150.0" y="335.0" width="160" height="22" rx="8" fill="#f8fafc" opacity="0.92"/>
<text x="1230.0" y="352.0" text-anchor="middle" class="edge-label">stamp</text>
<path d="M1100,610 L1360,260" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)" stroke-dasharray="7 6"/>
<rect x="1150.0" y="410.0" width="160" height="22" rx="8" fill="#f8fafc" opacity="0.92"/>
<text x="1230.0" y="427.0" text-anchor="middle" class="edge-label">stamp</text>
<path d="M355,543 L1360,565" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)" stroke-dasharray="7 6"/>
<rect x="777.5" y="529.0" width="160" height="22" rx="8" fill="#f8fafc" opacity="0.92"/>
<text x="857.5" y="546.0" text-anchor="middle" class="edge-label">optional raw-dir only</text>
<path d="M740,910 L835,910" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/>
<path d="M1075,910 L1170,910" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/>
<path d="M1320,910 L1455,454" fill="none" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="1307.5" y="657.0" width="160" height="22" rx="8" fill="#f8fafc" opacity="0.92"/>
<text x="1387.5" y="674.0" text-anchor="middle" class="edge-label">summary</text>
<rect x="95" y="210" width="260" height="86" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
<text x="225.0" y="236" text-anchor="middle" class="box-title" style="font-size:16px">python -m evals</text>
<text x="225.0" y="265" text-anchor="middle" class="box-body" style="font-size:13px">--backend required: mock,</text>
<text x="225.0" y="281" text-anchor="middle" class="box-body" style="font-size:13px">minimax, openai_compat</text>
<rect x="95" y="360" width="260" height="70" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
<text x="225.0" y="386" text-anchor="middle" class="box-title" style="font-size:16px">Scenario selector</text>
<text x="225.0" y="415" text-anchor="middle" class="box-body" style="font-size:13px">--tag phase11 or explicit set</text>
<rect x="95" y="500" width="260" height="86" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
<text x="225.0" y="526" text-anchor="middle" class="box-title" style="font-size:16px">Output flags</text>
<text x="225.0" y="555" text-anchor="middle" class="box-body" style="font-size:13px">--report writes one report;</text>
<text x="225.0" y="571" text-anchor="middle" class="box-body" style="font-size:13px">--raw-dir optionally writes raw</text>
<text x="225.0" y="587" text-anchor="middle" class="box-body" style="font-size:13px">per-scenario artifacts</text>
<rect x="500" y="205" width="250" height="74" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
<text x="625.0" y="231" text-anchor="middle" class="box-title" style="font-size:16px">Fresh pipeline</text>
<text x="625.0" y="260" text-anchor="middle" class="box-body" style="font-size:13px">per scenario; no state leakage</text>
<rect x="500" y="330" width="250" height="74" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
<text x="625.0" y="356" text-anchor="middle" class="box-title" style="font-size:16px">InstrumentedBackend</text>
<text x="625.0" y="385" text-anchor="middle" class="box-body" style="font-size:13px">shared counter wraps every</text>
<text x="625.0" y="401" text-anchor="middle" class="box-body" style="font-size:13px">backend factory</text>
<rect x="500" y="455" width="250" height="74" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
<text x="625.0" y="481" text-anchor="middle" class="box-title" style="font-size:16px">Run turns</text>
<text x="625.0" y="510" text-anchor="middle" class="box-body" style="font-size:13px">pipeline.process(message)</text>
<rect x="500" y="580" width="250" height="84" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
<text x="625.0" y="606" text-anchor="middle" class="box-title" style="font-size:16px">Evaluate assertions</text>
<text x="625.0" y="635" text-anchor="middle" class="box-body" style="font-size:13px">strategy, modulator ranges,</text>
<text x="625.0" y="651" text-anchor="middle" class="box-body" style="font-size:13px">memory/open-loop effects, debug</text>
<text x="625.0" y="667" text-anchor="middle" class="box-body" style="font-size:13px">fields</text>
<rect x="1000" y="220" width="200" height="90" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
<text x="1100.0" y="246" text-anchor="middle" class="box-title" style="font-size:16px">Code identity</text>
<text x="1100.0" y="275" text-anchor="middle" class="box-body" style="font-size:13px">git SHA, branch, dirty</text>
<text x="1100.0" y="291" text-anchor="middle" class="box-body" style="font-size:13px">worktree</text>
<rect x="1000" y="370" width="200" height="90" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
<text x="1100.0" y="396" text-anchor="middle" class="box-title" style="font-size:16px">Backend identity</text>
<text x="1100.0" y="425" text-anchor="middle" class="box-body" style="font-size:13px">type, requested/resolved</text>
<text x="1100.0" y="441" text-anchor="middle" class="box-body" style="font-size:13px">model, base URL</text>
<rect x="1000" y="520" width="200" height="90" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
<text x="1100.0" y="546" text-anchor="middle" class="box-title" style="font-size:16px">Config fingerprints</text>
<text x="1100.0" y="575" text-anchor="middle" class="box-body" style="font-size:13px">SHA-256 over</text>
<text x="1100.0" y="591" text-anchor="middle" class="box-body" style="font-size:13px">prompt/config files</text>
<rect x="1360" y="220" width="190" height="80" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
<text x="1455.0" y="246" text-anchor="middle" class="box-title" style="font-size:16px">EvalReport JSON</text>
<text x="1455.0" y="275" text-anchor="middle" class="box-body" style="font-size:13px">turns, latency, LLM</text>
<text x="1455.0" y="291" text-anchor="middle" class="box-body" style="font-size:13px">calls, pass/fail</text>
<rect x="1360" y="370" width="190" height="84" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
<text x="1455.0" y="396" text-anchor="middle" class="box-title" style="font-size:16px">Ablation reports</text>
<text x="1455.0" y="425" text-anchor="middle" class="box-body" style="font-size:13px">baseline.json,</text>
<text x="1455.0" y="441" text-anchor="middle" class="box-body" style="font-size:13px">per-variant JSON,</text>
<text x="1455.0" y="457" text-anchor="middle" class="box-body" style="font-size:13px">summary.json</text>
<rect x="1360" y="520" width="190" height="90" rx="16" fill="#e2e8f0" stroke="#64748b" stroke-width="2" filter="url(#shadow)"/>
<text x="1455.0" y="546" text-anchor="middle" class="box-title" style="font-size:16px">Honest nulls</text>
<text x="1455.0" y="575" text-anchor="middle" class="box-body" style="font-size:13px">tokens, cost, retries</text>
<text x="1455.0" y="591" text-anchor="middle" class="box-body" style="font-size:13px">remain null until</text>
<text x="1455.0" y="607" text-anchor="middle" class="box-body" style="font-size:13px">client instrumentation</text>
<text x="1455.0" y="623" text-anchor="middle" class="box-body" style="font-size:13px">exists</text>
<rect x="500" y="875" width="240" height="70" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
<text x="620.0" y="901" text-anchor="middle" class="box-title" style="font-size:16px">Pre-registered variants</text>
<text x="620.0" y="930" text-anchor="middle" class="box-body" style="font-size:13px">relationship, inner dialogue,</text>
<text x="620.0" y="946" text-anchor="middle" class="box-body" style="font-size:13px">defense, semantic memory</text>
<rect x="835" y="875" width="240" height="70" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
<text x="955.0" y="901" text-anchor="middle" class="box-title" style="font-size:16px">PipelineFeatures toggles</text>
<text x="955.0" y="930" text-anchor="middle" class="box-body" style="font-size:13px">component bypass contract</text>
<rect x="1170" y="875" width="300" height="70" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
<text x="1320.0" y="901" text-anchor="middle" class="box-title" style="font-size:16px">Outcome labels</text>
<text x="1320.0" y="930" text-anchor="middle" class="box-body" style="font-size:13px">expected_failure, unexpected_failure,</text>
<text x="1320.0" y="946" text-anchor="middle" class="box-body" style="font-size:13px">no_effect, newly_passing</text>
<text x="80" y="845" text-anchor="start" fill="#0f172a" font-size="16" font-weight="700" class="plain">The eval CLI is not a unit-test runner. It is a behavioral</text>
<text x="80" y="866" text-anchor="start" fill="#0f172a" font-size="16" font-weight="700" class="plain">scenario runner that can use mock or real LLM backends, while</text>
<text x="80" y="887" text-anchor="start" fill="#0f172a" font-size="16" font-weight="700" class="plain">recording enough provenance to make reports interpretable</text>
<text x="80" y="908" text-anchor="start" fill="#0f172a" font-size="16" font-weight="700" class="plain">later.</text>
</svg>
