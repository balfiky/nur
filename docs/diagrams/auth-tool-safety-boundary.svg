<rect x="80" y="170" width="640" height="60" rx="10" fill="#ddf4ff" stroke="#218bff" stroke-width="1.5"/>
<text x="400.0" y="193" text-anchor="middle" font-family="'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="15" font-weight="700" fill="#0550ae">Incoming HTTP / WebSocket request</text>
