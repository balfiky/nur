<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc"><title id="title">Auth and Tool-Safety Boundaries</title><desc id="desc">Two independent switches. api_key controls HTTP access; tools_enabled + shell_tool_enabled control side effects. Turning one on does not turn on the other.</desc><defs><marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L9,5 L1,9 Z" fill="#57606a"/></marker></defs><rect width="100%" height="100%" fill="#fafbfc"/><text x="48" y="52" text-anchor="start" font-family="'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="28" font-weight="800" fill="#1f2328">Auth and Tool-Safety Boundaries</text><text x="48" y="78" text-anchor="start" font-family="'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="14" font-weight="400" fill="#57606a">Two independent switches. api_key controls HTTP access; tools_enabled + shell_tool_enabled control side effects. Turning one on does not turn on the other.</text><rect x="40" y="120" width="720" height="700" rx="18" fill="none" stroke="#218bff" stroke-width="1.5" stroke-dasharray="6 5" opacity="0.85"/>
<text x="56" y="142" text-anchor="start" font-family="'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="13" font-weight="700" fill="#0550ae">HTTP request gate — api_key</text>
<rect x="800" y="120" width="760" height="700" rx="18" fill="none" stroke="#cf222e" stroke-width="1.5" stroke-dasharray="6 5" opacity="0.85"/>
