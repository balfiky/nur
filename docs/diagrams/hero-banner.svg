<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc"><title id="title">State that persists between your turns</title><desc id="desc">Every turn reads and writes the same cognitive state. The assistant's stance toward you accumulates instead of resetting.</desc><defs><marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L9,5 L1,9 Z" fill="#57606a"/></marker></defs><rect width="100%" height="100%" fill="#fafbfc"/><text x="48" y="52" text-anchor="start" font-family="'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="28" font-weight="800" fill="#1f2328">State that persists between your turns</text><text x="48" y="78" text-anchor="start" font-family="'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="14" font-weight="400" fill="#57606a">Every turn reads and writes the same cognitive state. The assistant's stance toward you accumulates instead of resetting.</text><rect x="60" y="130" width="470" height="170" rx="10" fill="#dafbe1" stroke="#2da44e" stroke-width="1.5"/>
<text x="295.0" y="153" text-anchor="middle" font-family="'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="14" font-weight="700" fill="#116329">Mon</text>
