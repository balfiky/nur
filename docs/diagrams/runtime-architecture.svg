<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
<title id="title">Project Nūr Runtime Architecture</title>
<desc id="desc">Two runtime hosts share one session and cognitive layer; persistence and tool access are explicitly gated.</desc>
