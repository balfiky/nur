<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="coreGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAF6F2"/>
      <stop offset="100%" stop-color="#F0E8DD"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="1"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .title { font-size: 28px; font-weight: 700; fill: #1A1428; letter-spacing: -0.01em; }
      .subtitle { font-size: 14px; fill: #5A4A5A; }
      .band-label { font-size: 11px; font-weight: 700; letter-spacing: 0.18em; }
      .card-title { font-size: 14px; font-weight: 700; fill: #FFFFFF; }
      .card-detail { font-size: 11px; fill: #FFFFFF; opacity: 0.86; }
      .core-section-title { font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
      .core-line { font-size: 12px; fill: #1A1428; }
      .core-line-muted { font-size: 11px; fill: #5A4A5A; }
      .pill { font-size: 11px; font-weight: 600; fill: #1A1428; }
      .footnote { font-size: 11px; fill: #7A6A7A; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="780" fill="#FAF6F2"/>

  <text x="600" y="46" text-anchor="middle" class="title">Nūr at a glance</text>
  <text x="600" y="68" text-anchor="middle" class="subtitle">Channels speak in. A persistent cognitive core evolves between turns. Capabilities act, gated by intent.</text>

  <!-- ============ CHANNELS BAND (top) ============ -->
  <text x="60" y="108" class="band-label" fill="#7A4A8C">CHANNELS — how people reach Nūr</text>
  <line x1="60" y1="118" x2="1140" y2="118" stroke="#7A4A8C" stroke-opacity="0.18" stroke-width="1"/>

  <!-- Web UI -->
  <g filter="url(#soft)">
    <rect x="60" y="135" width="248" height="74" rx="10" fill="#7A4A8C"/>
  </g>
  <text x="78" y="162" class="card-title">Web UI</text>
  <text x="78" y="183" class="card-detail">FastAPI · bundled chat shell</text>
  <text x="78" y="199" class="card-detail">/settings workspace · /docs</text>

  <!-- Telegram -->
  <g filter="url(#soft)">
    <rect x="328" y="135" width="248" height="74" rx="10" fill="#7A4A8C"/>
  </g>
  <text x="346" y="162" class="card-title">Telegram</text>
  <text x="346" y="183" class="card-detail">allowlist-gated bot</text>
  <text x="346" y="199" class="card-detail">long-poll · per-user dedupe</text>

  <!-- Console -->
  <g filter="url(#soft)">
    <rect x="596" y="135" width="248" height="74" rx="10" fill="#7A4A8C"/>
  </g>
  <text x="614" y="162" class="card-title">Console</text>
  <text x="614" y="183" class="card-detail">terminal runtime + debug</text>
  <text x="614" y="199" class="card-detail">nur · nur-setup · nur-validate</text>

  <!-- REST API -->
  <g filter="url(#soft)">
    <rect x="864" y="135" width="276" height="74" rx="10" fill="#7A4A8C"/>
  </g>
  <text x="882" y="162" class="card-title">REST API</text>
  <text x="882" y="183" class="card-detail">/v1/chat · /v1/health</text>
  <text x="882" y="199" class="card-detail">bearer auth · per-user budgets</text>

  <!-- arrows down -->
  <g stroke="#1A1428" stroke-opacity="0.32" stroke-width="1.4" fill="none">
    <line x1="184" y1="218" x2="184" y2="245"/>
    <line x1="452" y1="218" x2="452" y2="245"/>
    <line x1="720" y1="218" x2="720" y2="245"/>
    <line x1="1002" y1="218" x2="1002" y2="245"/>
  </g>
  <g fill="#1A1428" fill-opacity="0.32">
    <polygon points="184,250 178,242 190,242"/>
    <polygon points="452,250 446,242 458,242"/>
    <polygon points="720,250 714,242 726,242"/>
    <polygon points="1002,250 996,242 1008,242"/>
  </g>

  <!-- ============ COGNITIVE CORE (middle) ============ -->
  <g filter="url(#soft)">
    <rect x="60" y="260" width="1080" height="370" rx="14" fill="url(#coreGrad)" stroke="#1A1428" stroke-opacity="0.06"/>
  </g>
  <text x="78" y="288" class="band-label" fill="#1A1428">PERSISTENT COGNITIVE CORE — state that survives between turns</text>

  <!-- Emotions card -->
  <rect x="84" y="304" width="510" height="146" rx="10" fill="#FFFFFF" stroke="#D08A4E" stroke-width="1.6"/>
  <rect x="84" y="304" width="6" height="146" rx="3" fill="#D08A4E"/>
  <text x="108" y="328" class="core-section-title" fill="#D08A4E">Emotions — six modulators</text>
  <g class="pill">
    <rect x="108" y="346" width="78" height="22" rx="11" fill="#FFF1E0"/>
    <text x="147" y="361" text-anchor="middle">arousal</text>
    <rect x="194" y="346" width="78" height="22" rx="11" fill="#FFF1E0"/>
    <text x="233" y="361" text-anchor="middle">valence</text>
    <rect x="280" y="346" width="86" height="22" rx="11" fill="#FFF1E0"/>
    <text x="323" y="361" text-anchor="middle">certainty</text>
    <rect x="374" y="346" width="78" height="22" rx="11" fill="#FFF1E0"/>
    <text x="413" y="361" text-anchor="middle">bonding</text>
    <rect x="460" y="346" width="74" height="22" rx="11" fill="#FFF1E0"/>
    <text x="497" y="361" text-anchor="middle">energy</text>
  </g>
  <g class="pill">
    <rect x="108" y="376" width="86" height="22" rx="11" fill="#FFF1E0"/>
    <text x="151" y="391" text-anchor="middle">resolution</text>
  </g>
  <text x="108" y="424" class="core-line">Decay over time, shift on events. Per-session JSON.</text>
  <text x="108" y="440" class="core-line-muted">Drives appraisal · weights memory retrieval · shapes self-check tone</text>

  <!-- Memory card -->
  <rect x="606" y="304" width="510" height="146" rx="10" fill="#FFFFFF" stroke="#2A8F6E" stroke-width="1.6"/>
  <rect x="606" y="304" width="6" height="146" rx="3" fill="#2A8F6E"/>
  <text x="630" y="328" class="core-section-title" fill="#2A8F6E">Memory — five layers</text>
  <g>
    <text x="630" y="354" class="core-line"><tspan font-weight="700">Short-term</tspan>  <tspan fill="#5A4A5A">turn-level, in-process</tspan></text>
    <text x="630" y="372" class="core-line"><tspan font-weight="700">Long-term</tspan>  <tspan fill="#5A4A5A">distilled emotional summaries · valence-weighted retrieval</tspan></text>
    <text x="630" y="390" class="core-line"><tspan font-weight="700">Relationship arc</tspan>  <tspan fill="#5A4A5A">rupture · repair · open loops · commitments</tspan></text>
    <text x="630" y="408" class="core-line"><tspan font-weight="700">Semantic</tspan>  <tspan fill="#5A4A5A">preferences · decisions · facts (topic-scoped)</tspan></text>
    <text x="630" y="426" class="core-line"><tspan font-weight="700">Life History</tspan>  <tspan fill="#5A4A5A">identity ledger · beliefs · drives · evolution events</tspan></text>
  </g>
  <text x="630" y="445" class="core-line-muted">SQLite per-user (data/&lt;user&gt;/nur.db) + shared (data/shared/life_history.db)</text>

  <!-- Identity card -->
  <rect x="84" y="464" width="510" height="146" rx="10" fill="#FFFFFF" stroke="#1A1428" stroke-width="1.6"/>
  <rect x="84" y="464" width="6" height="146" rx="3" fill="#1A1428"/>
  <text x="108" y="488" class="core-section-title" fill="#1A1428">Identity — who Nūr is becoming</text>
  <g>
    <text x="108" y="514" class="core-line"><tspan font-weight="700">Constitution</tspan>  <tspan fill="#5A4A5A">operator-set orientation rendered above beliefs every prompt</tspan></text>
    <text x="108" y="532" class="core-line"><tspan font-weight="700">Beliefs</tspan>  <tspan fill="#5A4A5A">confidence-weighted, decay-prone, promoted from recurring themes</tspan></text>
    <text x="108" y="550" class="core-line"><tspan font-weight="700">Drives</tspan>  <tspan fill="#5A4A5A">motivational pressure · drift tracked across experiences</tspan></text>
    <text x="108" y="568" class="core-line"><tspan font-weight="700">Self-traits</tspan>  <tspan fill="#5A4A5A">observed dispositions surfacing in /settings → Life History</tspan></text>
  </g>
  <text x="108" y="595" class="core-line-muted">Soul.yaml seeds it · operator-curated experiences shift it</text>

  <!-- Evolution / Learning card -->
  <rect x="606" y="464" width="510" height="146" rx="10" fill="#FFFFFF" stroke="#F5A65B" stroke-width="1.6"/>
  <rect x="606" y="464" width="6" height="146" rx="3" fill="#F5A65B"/>
  <text x="630" y="488" class="core-section-title" fill="#B5732A">Self-evolution &amp; learning</text>
  <g>
    <text x="630" y="514" class="core-line"><tspan font-weight="700">Metabolism</tspan>  <tspan fill="#5A4A5A">wall-clock decay · weak-belief revocation · theme→belief promotion</tspan></text>
    <text x="630" y="532" class="core-line"><tspan font-weight="700">Open questions</tspan>  <tspan fill="#5A4A5A">contradiction · low-confidence · drive-gap (operator-reviewable)</tspan></text>
    <text x="630" y="550" class="core-line"><tspan font-weight="700">Ask-user surfacing</tspan>  <tspan fill="#5A4A5A">drive-gated mid-chat questions, daily LearningBudget cap</tspan></text>
    <text x="630" y="568" class="core-line"><tspan font-weight="700">Skills</tspan>  <tspan fill="#5A4A5A">trigger-time loaded by applies_when chat hint</tspan></text>
  </g>
  <text x="630" y="595" class="core-line-muted">Tunable from /settings · inspectable evolution snapshot per user</text>

  <!-- arrows down -->
  <g stroke="#1A1428" stroke-opacity="0.32" stroke-width="1.4" fill="none">
    <line x1="240" y1="640" x2="240" y2="667"/>
    <line x1="480" y1="640" x2="480" y2="667"/>
    <line x1="720" y1="640" x2="720" y2="667"/>
    <line x1="960" y1="640" x2="960" y2="667"/>
  </g>
  <g fill="#1A1428" fill-opacity="0.32">
    <polygon points="240,672 234,664 246,664"/>
    <polygon points="480,672 474,664 486,664"/>
    <polygon points="720,672 714,664 726,664"/>
    <polygon points="960,672 954,664 966,664"/>
  </g>

  <!-- ============ CAPABILITIES BAND (bottom) ============ -->
  <text x="60" y="688" class="band-label" fill="#2A8F6E">CAPABILITIES — what Nūr can do, all gated by intent + autonomy level</text>
  <line x1="60" y1="698" x2="1140" y2="698" stroke="#2A8F6E" stroke-opacity="0.18" stroke-width="1"/>

  <!-- Skills -->
  <g filter="url(#soft)">
    <rect x="60" y="710" width="248" height="56" rx="10" fill="#FFFFFF" stroke="#2A8F6E" stroke-width="1.6"/>
  </g>
  <text x="78" y="732" class="core-line" font-weight="700" fill="#2A8F6E">Skills</text>
  <text x="78" y="752" class="core-line-muted">paste, file, zip · trigger-time loaded</text>

  <!-- Web search -->
  <g filter="url(#soft)">
    <rect x="328" y="710" width="248" height="56" rx="10" fill="#FFFFFF" stroke="#2A8F6E" stroke-width="1.6"/>
  </g>
  <text x="346" y="732" class="core-line" font-weight="700" fill="#2A8F6E">Web search</text>
  <text x="346" y="752" class="core-line-muted">DuckDuckGo provider · read-only</text>

  <!-- File ops -->
  <g filter="url(#soft)">
    <rect x="596" y="710" width="248" height="56" rx="10" fill="#FFFFFF" stroke="#D08A4E" stroke-width="1.6"/>
  </g>
  <text x="614" y="732" class="core-line" font-weight="700" fill="#B5732A">File ops</text>
  <text x="614" y="752" class="core-line-muted">workspace-scoped · assisted = clarify</text>

  <!-- Shell -->
  <g filter="url(#soft)">
    <rect x="864" y="710" width="276" height="56" rx="10" fill="#FFFFFF" stroke="#1A1428" stroke-width="1.6"/>
  </g>
  <text x="882" y="732" class="core-line" font-weight="700" fill="#1A1428">Shell</text>
  <text x="882" y="752" class="core-line-muted">separate opt-in · read-only sys facts default</text>

</svg>
