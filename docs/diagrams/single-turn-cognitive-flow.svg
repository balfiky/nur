<text x="1380.0" y="1150" text-anchor="middle" class="box-body" style="font-size:13px">response delivered, memory writes,</text>
<text x="1380.0" y="1166" text-anchor="middle" class="box-body" style="font-size:13px">energy drain, self-observation</text>
<rect x="1240" y="1255" width="280" height="68" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
<text x="1380.0" y="1281" text-anchor="middle" class="box-title" style="font-size:16px">Response + DebugState</text>
<text x="1380.0" y="1310" text-anchor="middle" class="box-body" style="font-size:13px">returned to host</text>
<text x="60" y="1245" text-anchor="start" fill="#0f172a" font-size="16" font-weight="700" class="plain">LLM-call accounting: common case = 1 call. Optional paths add inner dialogue (0 to 5+ calls depending on parse retries), LLM self-check (+1), and one</text>
<text x="60" y="1266" text-anchor="start" fill="#0f172a" font-size="16" font-weight="700" class="plain">regeneration (+1). Do not treat this as a fixed upper bound.</text>
