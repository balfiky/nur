data_dir: data
max_queue_per_user: 3
max_active_sessions: 10
session_timeout_seconds: 1800.0
console_enabled: true
telegram_token: ''
telegram_allowlist: []
telegram_poll_timeout: 30
dedupe_ttl: 60.0
# Start in mock mode so the first run works without any provider key.
# For a hosted provider / gateway, set llm_backend to "provider" and fill
# llm_base_url, llm_model, and llm_api_key.
# For a local or remote OpenAI-compatible endpoint, set llm_backend to
# "openai_compatible" and fill llm_base_url and llm_model.
# Codex CLI backend: set llm_backend to "codex"; llm_model is optional.
llm_backend: mock
llm_base_url: ''
llm_model: ''
llm_api_key: ''
debug_host: 127.0.0.1
debug_port: 8077
proactive_enabled: false
proactive_idle_threshold: 300.0
proactive_density_reference: 3
proactive_recovery_seconds: 300.0
proactive_check_interval: 60.0
api_key: ''
cors_origins: []
tools_enabled: false
autonomy_level: assisted
tools_workspace: ''
shell_tool_enabled: false
