data_dir: data
max_queue_per_user: 3
max_active_sessions: 10
session_timeout_seconds: 1800.0
console_enabled: true
telegram_token: ''
telegram_allowlist: []
telegram_poll_timeout: 30
dedupe_ttl: 60.0
# Nūr requires a real LLM backend. There is no mock or offline mode —
# whenever intelligence is required, the configured model is called.
#
# Default below is "openai_compatible" pointed at a local Ollama endpoint.
# Update llm_base_url and llm_model to match your installation, OR switch
# llm_backend to one of: "provider", "codex", "minimax", "auto".
# Provider/gateway: set llm_backend=provider, fill llm_base_url, llm_model, llm_api_key.
# Codex CLI: set llm_backend=codex; llm_model optional.
llm_backend: openai_compatible
llm_base_url: 'http://localhost:11434/v1'
llm_model: 'llama3.2'
llm_api_key: ''
debug_host: 127.0.0.1
debug_port: 8077
proactive_enabled: false
proactive_idle_threshold: 300.0
proactive_density_reference: 3
proactive_recovery_seconds: 300.0
proactive_check_interval: 60.0
api_key: ''
cors_origins: []
tools_enabled: false
autonomy_level: assisted
tools_workspace: ''
shell_tool_enabled: false
